[project]
name = "wenmei-global-ai-customer-system"
version = "1.4.0"
description = "文美全球AI获客系统 - AI-powered B2B lead generation, CRM, enterprise knowledge, sales operations and outreach automation"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "live: marks tests as live integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
